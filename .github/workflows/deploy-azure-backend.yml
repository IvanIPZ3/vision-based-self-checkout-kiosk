name: Deploy Backend to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'requirements.txt'
      - '.github/workflows/deploy-azure-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate backend package
        run: python -m compileall backend

      - name: Prepare deployment package
        run: |
          mkdir -p backend_release
          cp requirements.txt backend_release/requirements.txt
          cp -r backend backend_release/backend
          sed -i 's/\r$//' backend_release/backend/startup.sh
          chmod +x backend_release/backend/startup.sh
          cd backend_release
          zip -r ../backend_release.zip .

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy backend package
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp deploy \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_BACKEND_APP_NAME }}" \
              --src-path backend_release.zip \
              --type zip
