name: Deploy Frontend to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'tsconfig.json'
      - 'tsconfig.app.json'
      - 'tsconfig.node.json'
      - 'server.mjs'
      - '.github/workflows/deploy-azure-frontend-appservice.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend for Azure App Service
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Prepare frontend package
        run: |
          mkdir -p frontend_release/dist
          cp -r dist/. frontend_release/dist/
          cp server.mjs frontend_release/server.mjs
          cd frontend_release
          zip -r ../frontend_release.zip .

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure frontend startup command
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp config set \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_FRONTEND_APP_NAME }}" \
              --startup-file "node /home/site/wwwroot/server.mjs"

      - name: Deploy frontend package
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp deploy \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_FRONTEND_APP_NAME }}" \
              --src-path frontend_release.zip \
              --type zip

      - name: Restart frontend app
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp restart \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_FRONTEND_APP_NAME }}"
